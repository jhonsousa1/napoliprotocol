<feColorMatrix in="g" type="matrix" values="0 0 0 0 .16  0 0 0 0 .08  0 0 0 0 .02  0 0 0 -.9 .52" result="ga"/>
<feComposite in="ga" in2="d" operator="in" result="gs"/>
<feMerge><feMergeNode in="d"/><feMergeNode in="gs"/></feMerge>
</filter>
