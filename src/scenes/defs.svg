<!-- Definições compartilhadas da jornada: materiais, filtros e adereços reutilizados. Os ids existem só aqui. -->
<defs>
<filter id="paint" x="-6%" y="-6%" width="112%" height="112%">
<feTurbulence type="fractalNoise" baseFrequency=".032" numOctaves="2" seed="7" result="n"/>
